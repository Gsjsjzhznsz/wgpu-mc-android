# Builds the release jar: the Rust JNI bridge cross-compiled for the platforms the port ships,
# then the mod jar with those libraries packaged inside it.
#
# The jar this produces is the one a launcher (FCL, Pojav and friends) takes: it carries
# `assets/wgpu_mc/natives/android-<abi>/libwgpu_mc_jni.so` for Android and
# `assets/wgpu_mc/natives/{ios-arm64,macos-arm64}/libwgpu_mc_jni.dylib` for the Apple platforms,
# which is what the mod's loader extracts and `System.load`s on each device - the file a
# desktop-populated jar never had, and the reason an Android launch (and later an iOS one) died in
# `WgpuNative` with a `FileNotFoundException` before this pipeline existed.
#
# The Android ABIs are built into one jar here, on Linux: arm64-v8a is what every real device
# speaks, x86_64 is what an emulator speaks, and the two cost one CI job's worth of time more than
# one of them.
#
# The Apple platforms need a Mac - Xcode's linker and the iOS SDK are not things a Linux runner can
# be handed - so the `natives-apple` job builds `aarch64-apple-ios` and `aarch64-apple-darwin` first
# and uploads the dylibs as artifacts; the `build` job downloads them into the exact target paths the
# engine's build would have put them at (`target/<triple>/release/`), and `copyNatives` packages them
# like any other. A release therefore waits on both jobs: a jar whose Apple half is missing would put
# the `FileNotFoundException` right back on the platforms it was built for.
#
# Pushing a tag `v*` publishes the jar as a GitHub release; every push keeps it available as a
# workflow artifact.
#
# What guards a release, in the order it can fail:
#   - the tag/version assert (a tag whose `neoforge_mod_version` did not move is stopped before
#     anything is built - a duplicate-version release is the one mistake the update checker cannot
#     warn about, because its promos would name the old build as current and that is "up to date");
#   - the Rust test suite (`cargo test`), which carries the packaging contract between
#     `updates.json` and `gradle.properties`;
#   - the jar content check, which is the step that can fail - `copyNatives` warns and skips when no
#     native was built, and a natives-less jar released would be a `FileNotFoundException` on every
#     device that installed it. Both Android ABIs and both Apple libraries are asserted, because all
#     four are built two jobs above.
name: android

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

# A main push and its tag release build in parallel and share one rust-cache key; without a group
# they race for it and the loser pays a full cold build. Tag runs are never cancelled: the release
# is the point of the run.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # **The Apple half of the jar, built where only a Mac can build it.** The dylibs are uploaded as
  # artifacts laid out exactly as the engine's own `target/` tree would name them, so the Linux job
  # below can drop them in and let `copyNatives` treat them like any other triple's output.
  natives-apple:
    name: Rust (iOS + macOS dylibs)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain and the Apple targets
        shell: bash
        working-directory: wgpu-mc-neo/rust
        run: |
          rustup toolchain install "$(grep -m1 'channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup target add aarch64-apple-ios aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wgpu-mc-neo/rust
          key: apple
          cache-on-failure: true

      - name: Build the JNI bridge for iOS
        shell: bash
        working-directory: wgpu-mc-neo/rust
        # Line tables are what `debug = "line-tables-only"` puts in the binary, and on-device there
        # is no sidecar dSYM for them to live in - they would ride into the jar. Symbol names stay
        # (panics and profilers read those); the line tables, which nothing on a device reads, go.
        env:
          RUSTFLAGS: -C strip=debuginfo
        run: cargo build --release -p wgpu-mc-jni --target aarch64-apple-ios

      - name: Build the JNI bridge for macOS (arm64)
        shell: bash
        working-directory: wgpu-mc-neo/rust
        env:
          RUSTFLAGS: -C strip=debuginfo
        run: cargo build --release -p wgpu-mc-jni --target aarch64-apple-darwin

      - name: Ad-hoc sign the dylibs
        shell: bash
        working-directory: wgpu-mc-neo/rust
        # The launchers that run this port on iOS load natives through their own sandbox, and an
        # unsigned Mach-O is refused there before `System.load` ever sees it. `ldid -S` is the
        # signer the iOS side of that ecosystem expects (it writes the iOS platform into the
        # signature); `codesign --sign -` is the fallback that keeps a macOS-only jar working if
        # brew cannot hand ldid over. Signed ad hoc, on purpose: the jar is not App Store freight.
        run: |
          set -e
          brew list ldid >/dev/null 2>&1 || brew install ldid
          for dylib in target/aarch64-apple-ios/release/libwgpu_mc_jni.dylib \
                       target/aarch64-apple-darwin/release/libwgpu_mc_jni.dylib; do
            if command -v ldid >/dev/null 2>&1; then
              ldid -S "$dylib"
              echo "signed with ldid: $dylib"
            else
              codesign --force --sign - "$dylib"
              echo "signed with codesign (ad hoc): $dylib"
            fi
          done

      - name: Lay the dylibs out as the engine's own target tree would
        shell: bash
        working-directory: wgpu-mc-neo/rust
        run: |
          set -e
          mkdir -p staging/aarch64-apple-ios/release staging/aarch64-apple-darwin/release
          cp target/aarch64-apple-ios/release/libwgpu_mc_jni.dylib staging/aarch64-apple-ios/release/
          cp target/aarch64-apple-darwin/release/libwgpu_mc_jni.dylib staging/aarch64-apple-darwin/release/
          ls -lh staging/aarch64-apple-ios/release staging/aarch64-apple-darwin/release

      - name: Upload the Apple dylibs
        uses: actions/upload-artifact@v4
        with:
          name: natives-apple
          path: wgpu-mc-neo/rust/staging
          if-no-files-found: error

  build:
    name: Rust (NDK) + mod jar
    runs-on: ubuntu-latest
    # The Apple dylibs arrive from the job above, and the jar cannot be checked - or released -
    # without them.
    needs: natives-apple
    # The release step creates a release and uploads the jar to it; the job's default GITHUB_TOKEN
    # is read-only, and softprops/action-gh-release dies on the 403 that follows.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag agrees with the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        # tag `v0.1.K-android` ships mod version `2612.0.8-android.(K+1)` - the mapping every
        # release so far has kept, and the one a forgotten `gradle.properties` bump breaks
        # silently. Checked first, so the failure costs seconds rather than a full build.
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # The number sits in the middle of `v0.1.K-android`, so it is the last run of digits in
          # the whole tag, not the suffix: grep them all and take the last.
          number="$(echo "$tag" | grep -oE '[0-9]+' | tail -n1)"
          if [ -z "$number" ]; then
            echo "::error::tag $tag carries no version number; the mapping v0.1.K-android -> android.(K+1) cannot be checked"
            exit 1
          fi
          # One release, one build number, every Minecraft line: each module's version is
          # `<line prefix>.<line version>-android.(K+1)` - the prefixes differ per line
          # (2612 for 26.1.2, 2620 for 26.2), the `-android.K` tail is the one number the tag
          # moves, and a module whose tail did not move ships a duplicate version that the
          # update checker cannot warn about.
          want="android.$((number + 1))"
          failed=0
          for props in Neolectrum/gradle.properties Neolectrum-*/gradle.properties; do
            # The loader modules (`Neolectrum-26.2-fabric` and friends) read their version from
            # that line's NeoForge tree and carry no version of their own - a module without the
            # key is skipped, not failed. Guarded, not piped into an assignment: `set -e` kills
            # the whole step on a grep that matches nothing, which is what the first tag run died
            # of, silently, one module in.
            if ! grep -q '^neoforge_mod_version=' "$props"; then
              echo "tag $tag skips $props (no neoforge_mod_version of its own)"
              continue
            fi
            have="$(grep -m1 '^neoforge_mod_version=' "$props" | cut -d= -f2)"
            echo "tag $tag wants *-$want; $props says $have"
            case "$have" in
              *-"$want") ;;
              *)
                echo "::error::$props needs neoforge_mod_version=<line>-$want - bump every version module together before tagging"
                failed=1 ;;
            esac
          done
          exit $failed

      - name: Audit every mixin target against the vanilla jar
        # The mixin annotations carry their targets as strings nothing at compile
        # time checks, and a target that does not exist at runtime is a class that
        # fails to transform - on Fabric that was "joining a world crashes the
        # client" (the SectionCompiler compile descriptor was NeoForge's
        # five-argument shape, which vanilla does not have). The audit resolves
        # every `method =`/`target =`/`@Accessor`/`@Invoker` string in both
        # mixins.json files against the real vanilla 26.1.2 client jar - the jar
        # both loaders share - before a single build step runs. NeoForge-only
        # surfaces live in scripts/mixin_audit_allowlist.txt with a reason.
        run: |
          fetch_client_jar() {
            version="$1"
            jar=".mc-cache/client-$version.jar"
            if [ ! -f "$jar" ]; then
              mkdir -p .mc-cache
              url="$(curl -sfL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json \
                | python3 -c "import json,sys;print(next(v['url'] for v in json.load(sys.stdin)['versions'] if v['id']=='$version'))")"
              curl -sfL "$url" -o .mc-cache/version-$version.json
              client="$(python3 -c "import json;print(json.load(open('.mc-cache/version-$version.json'))['downloads']['client']['url'])")"
              curl -sfL "$client" -o "$jar"
            fi
            ls -la "$jar"
          }

          # One audit per Minecraft line: the line's vanilla jar, and the source roots whose
          # mixins apply to it - the version overlay first, the shared tree second, so a mixin
          # both trees hold is audited from its version-specific source. The fabric module's
          # own mixins.json is audited beside the shared one on every line, exactly as before.
          fetch_client_jar 26.1
          python3 scripts/audit_mixin_targets.py --jar .mc-cache/client-26.1.jar \
            --allow scripts/mixin_audit_allowlist.txt \
            Neolectrum/src/main/resources/wgpu_mc.mixins.json \
            Neolectrum-fabric/src/main/resources/wgpu_mc.mixins.json

          fetch_client_jar 26.2
          python3 scripts/audit_mixin_targets.py --jar .mc-cache/client-26.2.jar \
            --source-root Neolectrum-26.2/src/main/java \
            --source-root Neolectrum/src/main/java \
            --allow scripts/mixin_audit_allowlist.txt \
            Neolectrum/src/main/resources/wgpu_mc.mixins.json \
            Neolectrum-fabric/src/main/resources/wgpu_mc.mixins.json

          # The 1.20.1 line is deliberately not audited here: the audit resolves Mojang's
          # official names against the vanilla jar, and 26.x's vanilla jar carries those names
          # while 1.20.1's is obfuscated - every entry would read as missing. That line's guard
          # is the compile itself: its mixin annotation processor resolves every target against
          # the mapped jar (with identity rows for the classes Mojang does not obfuscate, see
          # scripts/tiny_named_intermediary.py), and the runtime refmap ships beside it.

      - name: Audit every mixin claim against fabric-api's own
        # The target audit above proves our injection strings describe members
        # the game has; it cannot see the other failure mode - another mod
        # injecting into the *same instruction*. Two @Redirects on one call
        # cannot both apply: Mixin hands the instruction to one and the other's
        # require check then throws, which is a class that fails to transform -
        # on Fabric that was "joining a world crashes the client" again (our
        # tesselateBlock redirect collided with Indigo's own redirect of the
        # same call, which is there on every Fabric install by design). This
        # step reads fabric-api's *compiled* mixin classes (Java 25 class
        # files, no JDK needed) from the pinned release the players actually
        # run, cross-checks every claimed instruction, and fails the build on
        # any overlap that is not two plain @Injects.
        run: |
          run_conflict_audit() {
            mc_version="$1"
            pin_file="$2"
            jar=".mc-cache/client-$mc_version.jar"
            fa_version="$(tr -d '[:space:]' < "$pin_file")"
            fa_jar=".mc-cache/fabric-api-$fa_version.jar"
            if [ ! -f "$fa_jar" ]; then
              mkdir -p .mc-cache
              # the pin is the full version_number (it names its own game
              # version), so no game_versions filter - one exact match or fail
              fa_url="$(curl -sfL "https://api.modrinth.com/v2/project/fabric-api/version" \
                | python3 -c "import json,sys; pin='$fa_version'; print(next(v['files'][0]['url'] for v in json.load(sys.stdin) if v['version_number']==pin))")"
              curl -sfL "$fa_url" -o "$fa_jar"
            fi
            ls -la "$fa_jar"
            python3 scripts/audit_mixin_conflicts.py \
              --vanilla-jar "$jar" \
              --other-jar "$fa_jar" --other-name "fabric-api $fa_version" \
              Neolectrum/src/main/resources/wgpu_mc.mixins.json \
              Neolectrum-fabric/src/main/resources/wgpu_mc.mixins.json
          }

          run_conflict_audit 26.1 scripts/fabric_api_audit_pin.txt
          run_conflict_audit 26.2 scripts/fabric_api_audit_pin_26.2.txt

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        # The wrapper distribution, the NeoForge classpath and NeoGradle's decompile cache are
        # the longest wall-time chunk of this job; re-downloading them every run was most of a
        # build's minutes on every push.

      - name: Restore the cached Android NDK
        id: ndk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-ndk-r28b
          key: android-ndk-r28b-linux

      - name: Download the Android NDK (cache miss only)
        if: steps.ndk.outputs.cache-hit != 'true'
        shell: bash
        # Downloaded directly rather than through an action: one URL, one unzip. `--retry-all-errors`
        # is the part the android.17 run needed - `--retry` alone does not retry a mid-transfer
        # reset from dl.google.com, which is a transient this pipeline has hit more than once.
        run: |
          echo "::group::download"
          curl -fL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 20 -o "$RUNNER_TEMP/ndk.zip" https://dl.google.com/android/repository/android-ndk-r28b-linux.zip
          ls -lh "$RUNNER_TEMP/ndk.zip"
          echo "::endgroup::"
          echo "::group::unzip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          rm -f "$RUNNER_TEMP/ndk.zip"
          echo "::endgroup::"

      - name: Put the NDK's clang wrappers on PATH
        shell: bash
        run: |
          echo "$RUNNER_TEMP/android-ndk-r28b/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          # A GITHUB_PATH entry takes effect for the *next* step, not this one - so the sanity
          # check is the explicit path, not a PATH lookup.
          test -x "$RUNNER_TEMP/android-ndk-r28b/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

      - name: Install the pinned Rust toolchain and the Android targets
        shell: bash
        working-directory: wgpu-mc-neo/rust
        run: |
          rustup toolchain install "$(grep -m1 'channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wgpu-mc-neo/rust
          key: android
          # A Gradle-step failure after the long Rust compile used to throw the target cache away,
          # and the rerun this pipeline prescribes for transient failures paid both targets from
          # zero every time.
          cache-on-failure: true

      - name: Take the Apple dylibs the macOS job built
        uses: actions/download-artifact@v4
        with:
          name: natives-apple
          # The artifact is laid out as `target/<triple>/release/libwgpu_mc_jni.dylib`, so dropping
          # it into the engine's target tree is the whole handoff: `copyNatives` looks for each
          # triple exactly where the engine itself would have put it.
          path: wgpu-mc-neo/rust/target

      - name: Build the JNI bridge for arm64-v8a
        shell: bash
        working-directory: wgpu-mc-neo/rust
        # Line tables are what `debug = "line-tables-only"` puts in the binary, and on Android
        # there is no sidecar PDB for them to live in - they would ride into the jar. Symbol
        # names stay (panics and profilers read those); the line tables, which nothing on a
        # device reads, go.
        env:
          RUSTFLAGS: -C strip=debuginfo
        run: cargo build --release -p wgpu-mc-jni --target aarch64-linux-android

      - name: Build the JNI bridge for x86_64
        shell: bash
        working-directory: wgpu-mc-neo/rust
        env:
          RUSTFLAGS: -C strip=debuginfo
        run: cargo build --release -p wgpu-mc-jni --target x86_64-linux-android

      - name: Run the Rust test suite
        shell: bash
        working-directory: wgpu-mc-neo/rust
        # Host-target tests: the renderer logic, the packaging contract and the regression tests
        # every crash fix since android.14 has shipped with. `WGPU_MC_MOD_DIR` is what makes the
        # packaging tests find `updates.json` - without it they *skip green*, which is a test
        # suite that has never tested anything.
        env:
          WGPU_MC_MOD_DIR: ${{ github.workspace }}/Neolectrum
        run: cargo test -p wgpu-mc-jni --lib

      - name: Package the mod jar
        shell: bash
        working-directory: Neolectrum
        # `jarJar` is the task whose output (`-all`, with the Kotlin runtime embedded) is the
        # artifact a player installs; `copyNatives` runs inside it and lifts the four libraries
        # the two jobs above built into the jar's resources. `check` gates the mixin class
        # initialisers and the rest of the verification the build carries.
        run: ./gradlew check jarJar --no-daemon --stacktrace

      - name: Package the 26.2 mod jar (non-blocking)
        shell: bash
        working-directory: Neolectrum-26.2
        # The 26.2 sibling: the same pipeline one Minecraft line later. It reads the same Rust
        # tree this job already built (the natives are the same libraries every line ships) and
        # packs them the same way, so a 26.2 jar is the 26.1 jar's build twin, not a second
        # engine build. `bash gradlew`, not `./gradlew` - the same reason the fabric step spells
        # it that way: the repo keeps core.fileMode off, and this module's fresh wrapper carries
        # no execute bit on the checkout.
        #
        # **Non-blocking, and why**: NeoForm 26.2-2 - the patched pipeline every NeoForge 26.2
        # build runs - is currently broken upstream, against a jar nobody here chose. Mojang
        # touched the 26.2 version metadata (the manifest entry moved), and the NeoForm patch
        # checksums, which were taken over the *decompiled* sources (the decompile runs with the
        # game's own libraries on the classpath), no longer match what today's metadata
        # decompiles to: `Patch expected com/mojang/blaze3d/Blaze3D.class to have the checksum
        # 128065bd but it was 8bbd90ce`. The vanilla 26.2 client itself is unchanged - the jar
        # this build audits and the Fabric build compile against is byte-identical to what the
        # patches were cut from. Until NeoForge ships a NeoForm for the moved metadata, every
        # NeoForge 26.2 build in the world fails right here, and this step failing the release
        # would hold the 26.2 Fabric jar - the line's working artifact - hostage to it.
        continue-on-error: true
        run: bash gradlew check jarJar --no-daemon --stacktrace

      - name: Package the 26.2 Fabric mod jar
        shell: bash
        working-directory: Neolectrum-26.2-fabric
        # Same shape as the 26.1 fabric build: the shared tree plus the 26.2 overlay, compiled
        # against Fabric's 26.2 jars, reading its version from ../Neolectrum-26.2/gradle.properties
        # and its natives from the 26.2 NeoForge build above.
        run: bash gradlew build --no-daemon --stacktrace

      - name: Check what the 26.2 jars carry
        if: success()
        shell: bash
        working-directory: Neolectrum-26.2
        run: |
          jar=$(ls build/libs/*-all.jar 2>/dev/null | head -n 1 || true)
          if [ -z "$jar" ]; then
            # The NeoForge 26.2 build is non-blocking while NeoForm 26.2-2 is broken upstream
            # (see that step's note); its jar being absent is that failure arriving here, and
            # the fabric jar below is what ships for the line meanwhile.
            echo "::warning::no 26.2 NeoForge jar was produced - the line ships its Fabric jar only this release"
            exit 0
          fi
          echo "== $jar =="
          unzip -l "$jar"
          for abi in android-arm64-v8a android-x86_64; do
            if ! unzip -l "$jar" | grep -q "assets/wgpu_mc/natives/$abi/libwgpu_mc_jni.so"; then
              echo "::error::the 26.2 jar is missing assets/wgpu_mc/natives/$abi/libwgpu_mc_jni.so"
              exit 1
            fi
          done
          for dir in ios-arm64 macos-arm64; do
            if ! unzip -l "$jar" | grep -q "assets/wgpu_mc/natives/$dir/libwgpu_mc_jni.dylib"; then
              echo "::error::the 26.2 jar is missing assets/wgpu_mc/natives/$dir/libwgpu_mc_jni.dylib"
              exit 1
            fi
          done
          for lib in kotlin-stdlib kotlinforforge-neoforge kffmod-neoforge kfflib-neoforge kfflang-neoforge; do
            if ! unzip -l "$jar" | grep -q "META-INF/jarjar/.*$lib"; then
              echo "::error::the 26.2 jar is missing the embedded META-INF/jarjar/$lib"
              exit 1
            fi
          done
          fabric_jar=$(ls ../Neolectrum-26.2-fabric/build/libs/*.jar 2>/dev/null | grep -v -- '-sources' | head -n 1 || true)
          if [ -z "$fabric_jar" ]; then
            echo "::error::no 26.2 Fabric jar was built"
            exit 1
          fi
          if ! unzip -l "$fabric_jar" | grep -q "fabric.mod.json"; then
            echo "::error::the 26.2 Fabric jar does not carry fabric.mod.json"
            exit 1
          fi

      - name: Package the Fabric mod jar
        shell: bash
        working-directory: Neolectrum-fabric
        # The second loader: the same shared sources compiled against Fabric (loom + Mojmap
        # mappings, which 26.1's unobfuscated jar makes the same names both loaders load), with
        # this module's own entrypoints and metadata. It reads the version from
        # `Neolectrum/gradle.properties` and the natives from the NeoForge build above, so the
        # two jars in a release answer as one version and carry the same libraries. **Blocking
        # now**: the entrypoint crash android.43 shipped is fixed, people install the Fabric jar
        # as their primary build, and a Fabric compile break must hold the release rather than
        # ship a NeoForge-only one under a version the update checker calls current.
        #
        # This module's own wrapper: loom 1.19 asks for Gradle 9.8, and the NeoForge build's
        # wrapper pins 9.4.1 - two loaders, two builds, two Gradle floors. `bash gradlew`, not
        # `./gradlew`: the repo keeps core.fileMode off (the Windows half of it), so a checked-out
        # gradlew carries no execute bit and the launcher is read as an argument instead.
        run: bash gradlew build --no-daemon --stacktrace

      - name: Check what the Fabric jar carries
        if: success()
        shell: bash
        working-directory: Neolectrum-fabric
        run: |
          # Loom's remapJar names its output without the `-all` the NeoForge jarJar task uses:
          # `wgpu_mc-fabric-<version>.jar`, sources beside it.
          jar=$(ls build/libs/*.jar 2>/dev/null | grep -v -- '-sources' | head -n 1 || true)
          if [ -z "$jar" ]; then
            echo "::error::no Fabric jar was built, and the Fabric build is blocking now"
            exit 1
          fi
          echo "== $jar =="
          unzip -l "$jar"
          # Strict: the Fabric build is a blocking step now, so a jar that cannot run on a
          # device fails the run here rather than installing everywhere and running nowhere.
          for abi in android-arm64-v8a android-x86_64; do
            if ! unzip -l "$jar" | grep -q "assets/wgpu_mc/natives/$abi/libwgpu_mc_jni.so"; then
              echo "::error::the Fabric jar is missing assets/wgpu_mc/natives/$abi/libwgpu_mc_jni.so"
              exit 1
            fi
          done
          if ! unzip -l "$jar" | grep -q "fabric.mod.json"; then
            echo "::error::the Fabric jar does not carry fabric.mod.json"
            exit 1
          fi

      - name: Check what the jar carries
        shell: bash
        working-directory: Neolectrum
        # The one content check that can fail: `copyNatives` warns and skips when no native was
        # built, and a natives-less jar released would install everywhere and run nowhere. Both
        # Android ABIs and both Apple libraries are asserted, because all four are built two jobs
        # above.
        run: |
          jar=$(ls build/libs/*-all.jar | head -n 1)
          echo "== $jar =="
          unzip -l "$jar"
          for abi in android-arm64-v8a android-x86_64; do
            if ! unzip -l "$jar" | grep -q "assets/wgpu_mc/natives/$abi/libwgpu_mc_jni.so"; then
              echo "::error::the jar is missing assets/wgpu_mc/natives/$abi/libwgpu_mc_jni.so"
              exit 1
            fi
          done
          for dir in ios-arm64 macos-arm64; do
            if ! unzip -l "$jar" | grep -q "assets/wgpu_mc/natives/$dir/libwgpu_mc_jni.dylib"; then
              echo "::error::the jar is missing assets/wgpu_mc/natives/$dir/libwgpu_mc_jni.dylib"
              exit 1
            fi
          done
          # The embedded Kotlin/KFF dependencies are the point of the `-all` name: the stdlib is
          # what keeps a Kotlin mod off a `NoClassDefFoundError`, and the four KFF artifacts are
          # what keeps `modLoader="kotlinforforge"` from demanding a separate download. A jar
          # missing any of them is a release that launches nowhere.
          for lib in kotlin-stdlib kotlinforforge-neoforge kffmod-neoforge kfflib-neoforge kfflang-neoforge; do
            if ! unzip -l "$jar" | grep -q "META-INF/jarjar/.*$lib"; then
              echo "::error::the jar is missing the embedded META-INF/jarjar/$lib - the -all jar must carry its Kotlin/KFF dependencies"
              exit 1
            fi
          done

      - name: Set up JDK 21 for the 1.20.1 line
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
        # The 26.x builds run Gradle 9.8 on this JVM; the 1.20.1 modules run Gradle 8.14, which
        # does not run on 25. The compile still targets Java 17 - the floor a 1.20.1 launcher
        # hands the game - through the toolchain the modules' settings scripts resolve.

      - name: Package the 1.20.1 Forge jar
        shell: bash
        working-directory: Neolectrum-1.20.1
        # The line's "main" loader build - Forge 47.x, because NeoForge forked at 1.20.2 and does
        # not exist on 1.20.1. ForgeGradle 6 reobfuscates the jarJar output to the runtime's SRG
        # member names; the refmap beside it is the static one the line ships. Same engine, same
        # natives, same packaging contract as every other line.
        #
        # `bash gradlew`, not `./gradlew` - the repo keeps core.fileMode off, and this module's
        # wrapper carries no execute bit on the checkout.
        run: bash gradlew check jarJar --no-daemon --stacktrace

      - name: Package the 1.20.1 Fabric jar
        shell: bash
        working-directory: Neolectrum-1.20.1-fabric
        # The line's second loader: the shared whitelist plus the 1.20.1 overlay, compiled against
        # Mojang's official mappings and remapped to intermediary, with the refmap the annotation
        # processor writes from the mapping the build completes for it.
        run: bash gradlew build --no-daemon --stacktrace

      - name: Check what the 1.20.1 jars carry
        if: success()
        shell: bash
        working-directory: Neolectrum-1.20.1
        run: |
          jar=$(ls build/libs/*-all.jar 2>/dev/null | head -n 1 || true)
          if [ -z "$jar" ]; then
            echo "::error::no 1.20.1 Forge jar was produced"
            exit 1
          fi
          echo "== $jar =="
          unzip -l "$jar"
          for abi in android-arm64-v8a android-x86_64; do
            if ! unzip -l "$jar" | grep -q "assets/wgpu_mc/natives/$abi/libwgpu_mc_jni.so"; then
              echo "::error::the 1.20.1 jar is missing assets/wgpu_mc/natives/$abi/libwgpu_mc_jni.so"
              exit 1
            fi
          done
          for dir in ios-arm64 macos-arm64; do
            if ! unzip -l "$jar" | grep -q "assets/wgpu_mc/natives/$dir/libwgpu_mc_jni.dylib"; then
              echo "::error::the 1.20.1 jar is missing assets/wgpu_mc/natives/$dir/libwgpu_mc_jni.dylib"
              exit 1
            fi
          done
          for f in META-INF/mods.toml wgpu_mc.mixins.json wgpu_mc.refmap.json; do
            if ! unzip -l "$jar" | grep -q "$f"; then
              echo "::error::the 1.20.1 jar is missing $f"
              exit 1
            fi
          done
          if ! unzip -l "$jar" | grep -q "META-INF/jarjar/.*kotlin-stdlib"; then
            echo "::error::the 1.20.1 jar is missing the embedded META-INF/jarjar/kotlin-stdlib"
            exit 1
          fi
          fabric_jar=$(ls ../Neolectrum-1.20.1-fabric/build/libs/*.jar 2>/dev/null | grep -v -- '-sources' | head -n 1 || true)
          if [ -z "$fabric_jar" ]; then
            echo "::error::no 1.20.1 Fabric jar was built"
            exit 1
          fi
          if ! unzip -l "$fabric_jar" | grep -q "fabric.mod.json"; then
            echo "::error::the 1.20.1 Fabric jar does not carry fabric.mod.json"
            exit 1
          fi
          if ! unzip -l "$fabric_jar" | grep -q "wgpu_mc.refmap.json"; then
            echo "::error::the 1.20.1 Fabric jar does not carry its refmap"
            exit 1
          fi

      - name: Set up JDK 25 for the rest of the build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
        # The switch back: loom 1.19 refuses a JVM younger than 25, and the 26.x builds after
        # this point run on it.

      - name: Upload the jars
        uses: actions/upload-artifact@v4
        with:
          name: wgpu_mc-android
          # Both loaders' jars, when the Fabric one exists (its build is still graduating; a
          # Fabric-only failure does not hold the release, and the glob simply matches less).
          path: |
            Neolectrum/build/libs/*-all.jar
            Neolectrum-fabric/build/libs/*.jar
            Neolectrum-26.2/build/libs/*-all.jar
            Neolectrum-26.2-fabric/build/libs/*.jar
            Neolectrum-1.20.1/build/libs/*-all.jar
            Neolectrum-1.20.1-fabric/build/libs/*.jar
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Both loaders' jars, when the Fabric one exists (its build is still graduating; the
          # glob matches what is there, and the release never holds for a missing Fabric jar).
          files: |
            Neolectrum/build/libs/*-all.jar
            Neolectrum-fabric/build/libs/*.jar
            Neolectrum-26.2/build/libs/*-all.jar
            Neolectrum-26.2-fabric/build/libs/*.jar
            Neolectrum-1.20.1/build/libs/*-all.jar
            Neolectrum-1.20.1-fabric/build/libs/*.jar
          generate_release_notes: true
