# The 1.20.1 line: the same renderer compiled against Minecraft 1.20.1.
#
# The version scheme encodes the Minecraft line in the leading four digits (26.1.2 -> `2612`,
# 26.2 -> `2620`, 1.20.1 -> `1201`), so a release carries one jar per line and each line's update
# checker reads its own prefix. The trailing `-android.K` is the number the release tag moves; the
# CI tag assert checks every line's gradle.properties carries the same one.
#
# **The property name is the line's version-of-record, whatever the loader.** 1.20.1 predates
# NeoForge (NeoForge forked from Forge at 1.20.2), so this line's "main" loader build is Forge
# 47.x - but the key stays `neoforge_mod_version`, because the CI tag assert reads exactly that
# key out of exactly the `Neolectrum*/gradle.properties` glob, and a line that renamed the key is
# a line the assert silently skips: a forgotten bump would ship a duplicate version the update
# checker cannot warn about. The name is history; the job it does is current.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=false

org.gradle.configuration-cache=false

# Minecraft 1.20.1 is obfuscated - unlike the 26.x lines, this build needs mappings. The Fabric
# build asks loom for Mojang's official mappings; the Forge build asks ForgeGradle for the same
# channel. No parchment entries.
minecraft_version=1.20.1
forge_version=47.4.28
forge_gradle_version=6.0.54
neoforge_mod_version=1201.0.1-android.55

neoforge_maven_group=dev.birb.wgpu
neoforge_kotlin_version=2.3.20

# Kotlin for Forge is NOT embedded on this line: the Forge build's entry is a plain `class` under
# the `javafml` loader (the same shape the Fabric entrypoint ships, whose public no-argument
# constructor the loader's reflective instantiation can touch), and the Kotlin runtime it needs
# rides in the jar through Forge's own jarJar as a bare kotlin-stdlib.
