modLoader="kotlinforforge"
loaderVersion="${kff_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/NTS-Official/Neolectrum/issues"
updateJSONURL="https://raw.githubusercontent.com/NTS-Official/Neolectrum/main/updates.json"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/NTS-Official/Neolectrum"
logoFile="assets/wgpu_mc/icon.png"
credits="Original Fabric mod by Birbe"
authors="NoTuring_Steve"
description='''
A renderer made to replace Blaze3D, written in Rust, using wgpu for cross-platform support.
Supported backends: Vulkan, D3D12.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="kotlinforforge"
type="required"
versionRange="${kff_version_range}"
ordering="NONE"
side="CLIENT"