# The 26.2 sibling of `Neolectrum`: the same renderer compiled against Minecraft 26.2.
#
# The version scheme encodes the Minecraft line in the leading four digits (26.1.2 -> `2612`,
# 26.2 -> `2620`), so a release carries one jar per line and each line's update checker reads its
# own prefix. The trailing `-android.K` is the number the release tag moves; the CI tag assert
# checks every line's gradle.properties carries the same one.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

org.gradle.configuration-cache=false

# Minecraft 26.2 is unobfuscated like 26.1 - no mappings/parchment entries.
# NeoForge 26.2 line: <minecraft>-<hotfix>.<release>; 26.2.0.93 is the latest stable 26.2 build.
neoforge_minecraft_version=26.2
neoforge_neo_version=26.2.0.93
neoforge_mod_version=2620.0.1-android.54

neoforge_maven_group=dev.birb.wgpu
neoforge_kotlin_version=2.3.20

# Kotlin for Forge's loader range - the same one the 26.1 module declares; KFF 6.4.0 is the
# newest build and its own `neoforge.mods.toml` accepts the 26.x lines.
kff_version_range=[6.3.0,)
