[workspace]

resolver = "2"

members = [
    "wgpu-mc",
    "wgpu-mc-jni",
    "wgpu-mc-demo",
    # **Vendored rather than taken from git, because one field had to be added to it**: a model face's
    # `shade` flag, which the game reads as `quad.materialInfo().shade()` and which decides whether the
    # face is drawn at its direction's brightness or at `up`. Upstream has no such field, and the crate is
    # 136 KB of serde types, so a copy that can be edited is cheaper than a fork that has to be published
    # before this renderer can use it.
    "minecraft-assets",
    # The tests of the two crates above read the mod's own files - its Kotlin, its language files, its
    # shader sources - out of the Neolectrum checkout, and this is the crate that finds it. It is a
    # dev-dependency and builds nothing into either library.
    "modtree"
]

# The vendored GLSL preprocessor is a workspace of its own with its own lock file, reached only
# through the path dependency in `wgpu-mc-jni`, so it stays out of this one.
exclude = ["cyntax"]

# **The one divergence from the published naga**: its SPIR-V backend decorated the
# fragment stage's `BuiltIn FrontFacing` bool input with `Flat`, which Qualcomm's
# Adreno A6xx driver answers with VK_ERROR_INVALID_SHADER_NV - and wgpu turns that
# into a lost device, so every two-sided-lit pipeline (`PER_FACE_LIGHTING`, the whole
# armor family) killed the renderer on a Snapdragon while Mali accepted it. The
# VUID the decoration cites (`StandaloneSpirv-Flat-04744`) mandates Flat for integer
# and double inputs only, and glslang never emits it on gl_FrontFacing, which is the
# shape every other Vulkan program ships. The fix is one match arm in the fork; it
# stays one commit on top of the exact published source, and [patch.crates-io] is
# what keeps it pinned to the same `naga = 30.0.1` wgpu already depends on.
#
# **The one divergence from the published wgpu-hal**: `Instance::from_raw` created the
# debug-utils messenger unconditionally whenever the driver listed VK_EXT_debug_utils.
# The Adreno 830 driver (Snapdragon 8 Elite, build 7853d15211) lists the extension and
# accepts it in vkCreateInstance, yet answers vkGetInstanceProcAddr with null for
# `vkCreateDebugUtilsMessengerEXT` on the launch right after another process of the
# game lost its device - and ash's stub for an unresolved function pointer panics from
# an `extern "system"` frame, which cannot unwind, so the whole game aborted with exit
# code 6 before a single frame of that launch. The fork asks the driver for the pointer
# first and degrades to "no debug messenger, no labels" when it is missing; on a driver
# that behaves, the code is bit-identical to upstream. Same pinning story as naga: one
# commit on the exact published source, held by [patch.crates-io].
#
# **The one divergence from the published wgpu-core**: every driver refusal that is
# neither OOM nor DEVICE_LOST - wgpu's `Unexpected`, which is what `VK_ERROR_INVALID_
# SHADER_NV` and friends map to - ran through `Device::lose` at the four creation sites
# that can carry one, so a single pipeline the driver rejected ended the renderer: a
# black screen, a dead swapchain and a relaunch, for one vendor SPIR-V opinion (the
# Task 12-15 Adreno losses all landed here). The fork downgrades exactly that error
# class at exactly those four sites: the refused module or pipeline never comes into
# existence, every later use of its handle is wgpu's ordinary invalid-resource
# validation error, and the game loses the draws that pipeline would have made instead
# of all of them. A genuinely gone device still answers `Lost` and still loses.
#
# **The second divergence from the published wgpu-core**: the indirect-call validation
# (`VALIDATION_INDIRECT_CALL`, which this renderer enables by default) built its two
# compute pipelines as a precondition of the device - a backend that refused them
# answered `DeviceError::Lost` for a construct the caller never asked for. The GLES
# backend runs that construction for the first time once wgpu-hal reports indirect
# execution by symbol (below), so the fork makes it best-effort: a validation that
# cannot be built is logged and skipped, and the device keeps its draws - which the
# device probes have already proven the shape of.
#
# **The one divergence from the published glow**: its `Gl` wrapper stopped one function
# short of the generated `GlFns` - `glMultiDrawElementsIndirect` was loaded wherever the
# context exported it (core GLES 3.1, core GL 4.3) and no caller could reach it. The
# fork adds the wrapper method and the symbol-loaded pair a context answers about
# itself, which is what lets wgpu-hal (above) decide the multi-draw capability by the
# symbol the context actually carries rather than by the version string a GL-on-Vulkan
# shim reports, and draw a batch as the one call it is.
[patch.crates-io]
naga = { git = "https://github.com/Gsjsjzhznsz/naga", branch = "main" }
wgpu-hal = { git = "https://github.com/Gsjsjzhznsz/wgpu-hal", branch = "main" }
wgpu-core = { git = "https://github.com/Gsjsjzhznsz/wgpu-core", branch = "main" }
glow = { git = "https://github.com/Gsjsjzhznsz/glow", branch = "main" }

[profile.release]
# Line tables, and only line tables, in the PDB beside the library.
#
# A PIX timing capture resolves the functions in its CPU samples and callstacks through PDBs, and a
# release build without this ships a PDB with no source files in it at all - so every frame from this
# crate showed up as an address, and the capture's `FunctionInformation`, `SymbolStrings` and
# `ModuleSymbols` tables came back empty. This costs nothing at runtime (the debug info lives in the
# PDB, not in the code), adds no locals or types, and is what makes a capture readable.
debug = "line-tables-only"